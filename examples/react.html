<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Scrollgrid — React</title>
    <style>
        html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
        body { display: flex; flex-direction: column; }
        header { padding: 12px 16px; border-bottom: 1px solid #ddd; }
        main { flex: 1; min-height: 0; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .toolbar button { padding: 4px 10px; }
        .grid-area { flex: 1; min-height: 0; }
    </style>
</head>
<body>
    <header><strong>React</strong> — wrapper component with imperative refresh.</header>
    <main>
        <div id="root" style="flex:1; min-height: 0; display: flex; flex-direction: column;"></div>
    </main>

    <script type="module">
        import 'scrollgrid/style.css';
        import React, { useRef, useState, StrictMode } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Scrollgrid } from '/src/react.jsx';

        function App() {
            const ref = useRef(null);
            const [rows, setRows] = useState(() => makeRows(50));
            const [clicked, setClicked] = useState(null);

            return React.createElement(React.Fragment, null,
                React.createElement('div', { className: 'toolbar' },
                    React.createElement('button', { onClick: () => setRows(makeRows(rows.length + 10)) }, 'Add 10 rows'),
                    ' ',
                    React.createElement('button', { onClick: () => ref.current?.refresh(true) }, 'Refresh'),
                    ' ',
                    clicked && React.createElement('span', null, ` last click: row ${clicked.rowIndex}, col ${clicked.columnIndex}`),
                ),
                React.createElement('div', { className: 'grid-area' },
                    React.createElement(Scrollgrid, {
                        ref,
                        data: rows,
                        headerRows: 1,
                        autoResize: true,
                        onCellClick: (_event, cell) => setClicked(cell),
                        style: { height: '100%', width: '100%' },
                    }),
                ),
            );
        }

        function makeRows(n) {
            const out = [['#', 'Name', 'Country', 'Revenue']];
            for (let i = 0; i < n; i += 1) {
                out.push([i + 1, `Customer ${i + 1}`, ['UK', 'US', 'DE'][i % 3], (Math.random() * 1000).toFixed(2)]);
            }
            return out;
        }

        createRoot(document.getElementById('root')).render(
            React.createElement(StrictMode, null, React.createElement(App))
        );
    </script>
</body>
</html>
